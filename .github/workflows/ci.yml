name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Alle drei Zielplattformen, weil das Release fuer alle drei ein Binary
    # baut. Hier zaehlt das besonders: fuenf Module verzweigen ueber
    # platform.system() bzw. sys.platform, und Rohsockets verhalten sich unter
    # Windows anders als unter Linux. Bisher wurde nur der Linux-Zweig je
    # ausgefuehrt, die anderen gingen ungeprueft ins Release.
    name: Lint & Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format check (ruff)
        # Formatierung ist plattformunabhaengig, einmal reicht.
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .
      - name: Test (pytest)
        run: pytest -v --cov=netfathom --cov-report=term-missing
