name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Alle drei Zielplattformen, weil das Release fuer alle drei ein Binary
    # baut. Hier zaehlt das besonders: fuenf Module verzweigen ueber
    # platform.system() bzw. sys.platform, und Rohsockets verhalten sich unter
    # Windows anders als unter Linux. Bisher wurde nur der Linux-Zweig je
    # ausgefuehrt, die anderen gingen ungeprueft ins Release.
    name: Lint & Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Every package, the build backend included, comes from
      # requirements/ci.txt with its hash checked; NetFathom itself is
      # installed without resolving or downloading anything further.
      # python -m pip, because pip.exe cannot replace itself on Windows.
      - name: Install pinned dependencies and tools
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock files match pyproject.toml
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp requirements/ci.txt fresh-ci.txt
          uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.11 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.11 --generate-hashes -o requirements/ci.txt" -o fresh-ci.txt
          diff requirements/ci.txt fresh-ci.txt
          cp requirements/release.txt fresh-release.txt
          uv pip compile pyproject.toml requirements/release-tools.in --extra build --universal --python-version 3.11 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml requirements/release-tools.in --extra build --universal --python-version 3.11 --generate-hashes -o requirements/release.txt" -o fresh-release.txt
          diff requirements/release.txt fresh-release.txt
      - name: Dependency audit (pip-audit)
        if: matrix.os == 'ubuntu-latest'
        run: pip-audit --skip-editable
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format check (ruff)
        # Formatierung ist plattformunabhaengig, einmal reicht.
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .
      - name: Test (pytest)
        run: pytest -v --cov=netfathom --cov-report=term-missing
